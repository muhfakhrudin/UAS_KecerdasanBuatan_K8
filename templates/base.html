<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}iRecom Master — Rekomendasi iPhone Bekas{% endblock %}</title>
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (!stored && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          display: ['Lexend', 'sans-serif'],
        },
        colors: {
          accent: {
            50: '#f0fdfa',
            100: '#ccfbf1',
            400: '#2dd4bf',
            500: '#14b8a6',
            600: '#0d9488',
            700: '#0f766e',
            950: '#042f2c',
          },
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  h1, h2, .font-display { font-family: 'Lexend', sans-serif; }
</style>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-800 dark:bg-zinc-950 dark:text-zinc-200 flex flex-col transition-colors duration-200">

<canvas id="cursor-trail" class="fixed inset-0 pointer-events-none z-[9999]" aria-hidden="true"></canvas>

<header class="border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-950/80 backdrop-blur sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="{% url 'index' %}" class="flex items-baseline gap-2">
      <span class="font-display text-xl font-bold text-zinc-900 dark:text-white">iRecom Master</span>
      <span class="hidden sm:inline text-xs text-zinc-400 dark:text-zinc-500">Rekomendasi iPhone Bekas Cerdas</span>
    </a>
    <div class="flex items-center gap-5">
      <a href="{% url 'restart' %}" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-accent-600 dark:hover:text-accent-400 transition-colors">Mulai Ulang</a>
      <button
        id="theme-toggle"
        type="button"
        aria-label="Ganti tampilan gelap/terang"
        class="w-9 h-9 flex items-center justify-center rounded-full border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-300 hover:border-accent-500 hover:text-accent-600 dark:hover:text-accent-400 transition-colors"
      >
        <svg class="w-4 h-4 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
        <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="flex-1">
  {% block content %}{% endblock %}
</main>

<footer class="border-t border-zinc-200 dark:border-zinc-800">
  <div class="max-w-5xl mx-auto px-6 py-6 text-center text-xs text-zinc-400 dark:text-zinc-600">
    iRecom Master &mdash; Sistem Rekomendasi iPhone Bekas berbasis AI (TF-IDF + BM25 + Value Score). Proyek UAS Kecerdasan Buatan.
  </div>
</footer>

<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    root.classList.toggle('dark');
    localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
  });
</script>

<script>
  (function () {
    var canHover = window.matchMedia('(pointer: fine)').matches;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canvas = document.getElementById('cursor-trail');
    if (!canHover || reduceMotion || !canvas) return;

    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var width, height;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    var nodes = [];
    var maxNodes = 70;
    var maxDist = 90;
    var lastX = null, lastY = null;
    var mouseX = width / 2, mouseY = height / 2;
    var headX = mouseX, headY = mouseY;
    var active = false;
    var lastTime = performance.now();

    window.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      active = true;

      if (lastX === null) {
        lastX = mouseX;
        lastY = mouseY;
        headX = mouseX;
        headY = mouseY;
      }
      var dx = mouseX - lastX;
      var dy = mouseY - lastY;
      var dist = Math.hypot(dx, dy);
      var minSpacing = 6;

      if (dist >= minSpacing) {
        var steps = Math.min(Math.ceil(dist / minSpacing), 10);
        for (var i = 1; i <= steps; i++) {
          var t = i / steps;
          nodes.push({
            x: lastX + dx * t,
            y: lastY + dy * t,
            life: 1,
          });
        }
        if (nodes.length > maxNodes) {
          nodes.splice(0, nodes.length - maxNodes);
        }
        lastX = mouseX;
        lastY = mouseY;
      }
    });

    document.addEventListener('mouseleave', function () {
      active = false;
    });

    function isDark() {
      return document.documentElement.classList.contains('dark');
    }

    function easeOut(t) {
      return 1 - (1 - t) * (1 - t);
    }

    function drawSmoothSpine(points, colorRgb) {
      if (points.length < 3) return;
      for (var i = 1; i < points.length - 1; i++) {
        var prev = points[i - 1];
        var curr = points[i];
        var next = points[i + 1];
        var startX = (prev.x + curr.x) / 2;
        var startY = (prev.y + curr.y) / 2;
        var endX = (curr.x + next.x) / 2;
        var endY = (curr.y + next.y) / 2;
        var eased = easeOut(Math.min(curr.life, next.life));
        var alpha = eased * 0.85;
        if (alpha <= 0.015) continue;
        ctx.strokeStyle = 'rgba(' + colorRgb + ',' + alpha + ')';
        ctx.lineWidth = 0.8 + eased * 2.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(curr.x, curr.y, endX, endY);
        ctx.stroke();
      }
    }

    function draw() {
      var now = performance.now();
      var dt = Math.min((now - lastTime) / 16.67, 3);
      lastTime = now;

      ctx.clearRect(0, 0, width, height);

      headX += (mouseX - headX) * Math.min(0.35 * dt, 1);
      headY += (mouseY - headY) * Math.min(0.35 * dt, 1);

      for (var i = nodes.length - 1; i >= 0; i--) {
        nodes[i].life -= 0.024 * dt;
        if (nodes[i].life <= 0) nodes.splice(i, 1);
      }

      var dark = isDark();
      var lineColor = dark ? '45, 212, 191' : '13, 148, 136';
      var dotColor = dark ? '94, 234, 212' : '15, 118, 110';

      // flowing trail spine (smoothed, tapered, fading)
      drawSmoothSpine(nodes.concat([{ x: headX, y: headY, life: 1 }]), lineColor);

      // constellation mesh between nearby recent nodes
      var meshStart = Math.max(0, nodes.length - 26);
      for (var a = meshStart; a < nodes.length; a++) {
        for (var b = a + 1; b < nodes.length; b++) {
          var n1 = nodes[a], n2 = nodes[b];
          var d = Math.hypot(n1.x - n2.x, n1.y - n2.y);
          if (d < maxDist) {
            var alpha = (1 - d / maxDist) * easeOut(Math.min(n1.life, n2.life)) * 0.32;
            if (alpha > 0.02) {
              ctx.strokeStyle = 'rgba(' + lineColor + ',' + alpha + ')';
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.stroke();
            }
          }
        }
      }

      for (var ni = nodes.length - 1; ni >= 0; ni -= 5) {
        var n = nodes[ni];
        var eased2 = easeOut(n.life);
        var r = 0.6 + eased2 * 1.1;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + dotColor + ',' + eased2 * 0.5 + ')';
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (active) {
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + dotColor + ', 0.95)';
        ctx.arc(headX, headY, 3, 0, Math.PI * 2);
        ctx.fill();

        var count = 0;
        for (var k = nodes.length - 1; k >= 0 && count < 6; k--, count++) {
          var n2 = nodes[k];
          var dd = Math.hypot(n2.x - headX, n2.y - headY);
          if (dd < maxDist * 1.3) {
            var a2 = (1 - dd / (maxDist * 1.3)) * easeOut(n2.life) * 0.6;
            ctx.strokeStyle = 'rgba(' + lineColor + ',' + a2 + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(headX, headY);
            ctx.lineTo(n2.x, n2.y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
</script>

</body>
</html>
